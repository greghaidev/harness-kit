# The kit is written on one machine and installed on others its author cannot reach, so every
# change is proven on all three platforms: the full suite, the store contract, and a real install
# into this runner's own home directory followed by verify.py, the same check an operator runs.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"   # the oldest the MCP SDK supports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check pyyaml "mcp[cli]" pytest

      - name: Git identity for the tests that commit
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci

      - name: Test suite
        run: python -m pytest -q

      - name: Store contract
        run: python core/01-memory/store_test.py

      - name: Install into this runner's home, exactly as an operator would
        run: python install.py --skip-mcp

      - name: Fill in the operating agreement (verify.py refuses an unfilled one)
        shell: python
        run: |
          import pathlib, re
          src = pathlib.Path("core/00-agreement/CLAUDE.md.template").read_text(encoding="utf-8")
          filled = re.sub(r"<<.*?>>", "ci", src, flags=re.S)
          assert "<<" not in filled
          dst = pathlib.Path.home() / ".claude" / "CLAUDE.md"
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(filled, encoding="utf-8")

      - name: verify.py, run the way Claude Code would run it
        # The interpreter and environment come from the settings.json the installer wrote, and
        # the working directory is outside the checkout, so nothing here leans on the repo.
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          settings = json.loads((pathlib.Path.home() / ".claude" / "settings.json").read_text(encoding="utf-8"))
          stop = [h for g in settings["hooks"]["Stop"] for h in g["hooks"]]
          python = stop[0]["command"]
          verify = pathlib.Path(settings["env"]["HARNESS_HOME"]) / "verify.py"
          print(f"{python} {verify}", flush=True)
          sys.exit(subprocess.run([python, str(verify)], env={**os.environ, **settings["env"]}).returncode)
